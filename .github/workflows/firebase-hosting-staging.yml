name: Deploy to Firebase Hosting staging
on:
  push:
    branches:
      - staging
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMPLIFY_GHANA }}
          channelId: live
          target: staging
          projectId: amplify-ghana
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
